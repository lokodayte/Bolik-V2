<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolik — Handcrafted Bubble Tea at UWC Dilijan</title>
    <meta name="description"
        content="Order handcrafted bubble tea for campus delivery at UWC Dilijan. Customize your drink, choose your bubbles, and enjoy.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap"

    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
</head>

<body>
    <div id="toast-container"></div>

    <div id="app">
        <nav>
            <div class="nav-brand"><img src="Bolik1.png" alt="logo" style="width: 110px;"></div>
            <div class="nav-links" id="nav-links"></div>
            <div class="nav-right">
                <span class="nav-user" id="nav-user"></span>
                <button class="nav-logout" onclick="logout()">Sign Out</button>
            </div>
        </nav>
        <main id="main-content"></main>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="img-modal" class="img-modal hidden" onclick="this.classList.add('hidden')"></div>

    <script src="shared.js" defer></script>
    <script src="app.js" defer></script>
