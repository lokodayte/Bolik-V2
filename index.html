<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolik — Handcrafted Bubble Tea at UWC Dilijan</title>
    <meta name="description"
        content="Order handcrafted bubble tea for campus delivery at UWC Dilijan. Customize your drink, choose your bubbles, and enjoy.">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
    <div id="toast-container"></div>

    <div id="app">
        <nav>
            <div class="nav-brand"><img src="Bolik1.png" alt="logo" style="width: 110px;"></div>
            <div class="nav-links" id="nav-links"></div>
            <div class="nav-right">
                <span class="nav-user" id="nav-user"></span>
                <button class="cart-btn hidden" id="nav-cart" onclick="toggleCart()">🛒<span class="cart-badge hidden"
                        id="cart-badge">0</span></button>
                <button class="nav-logout" onclick="logout()">Sign Out</button>
            </div>
        </nav>
        <main id="main-content"></main>
    </div>

    <div id="cart-panel">
        <div class="cart-header">
            <h2>Your Cart</h2><button class="modal-close" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer" id="cart-footer"></div>
    </div>
    <div id="cart-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250"
        onclick="toggleCart()"></div>

    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="img-modal" class="img-modal hidden" onclick="this.classList.add('hidden')"></div>

    <script src="shared.js"></script>
    <script src="app.js"></script>
</body>

</html>
